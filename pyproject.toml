[project]
name = "mcp-oauth"
version = "0.1.0"
description = "OAuth 2.1 + PKCE library for MCP (Model Context Protocol) servers"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "AI Toolbox Contributors", email = "contributors@example.com" }
]
keywords = ["oauth", "pkce", "mcp", "model-context-protocol", "authentication"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]
requires-python = ">=3.9"
dependencies = [
    "authlib>=1.3.0",
    "httpx>=0.25.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "mypy>=1.8.0",
    "pylint>=3.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/redhat-community-ai-tools/ai-toolbox"
Repository = "https://github.com/redhat-community-ai-tools/ai-toolbox.git"
Issues = "https://github.com/redhat-community-ai-tools/ai-toolbox/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_oauth"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --strict-config --verbose --cov=mcp_oauth --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/mcp_oauth"]
